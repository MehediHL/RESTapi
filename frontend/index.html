
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | REST API</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            padding: 30px 16px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 17px;
            font-size: 14px;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete-btn {
            background: #dc2626;
        }

        .update-btn {
            background: #059669;
        }

        .refresh-btn {
            background: #4b5563;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            overflow-wrap: anywhere;
        }

        th {
            background: #f9fafb;
        }

        td button {
            margin: 3px;
        }

        #message {
            margin-bottom: 18px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .success {
            color: #047857;
        }

        .error {
            color: #dc2626;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #6b7280;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>User Management System</h1>
        <p class="subtitle">HTML, CSS, JavaScript & Node.js REST API</p>

        <div id="message" role="status" aria-live="polite"></div>

        <!-- GET ALL USERS -->
        <section class="card">
            <h2>All Users</h2>

            <div class="button-group" style="margin-bottom: 18px;">
                <button onclick="getUsers()">Get All Users</button>
                <button class="refresh-btn" onclick="getUsers()">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable">
                        <tr>
                            <td colspan="4" class="empty">
                                Click "Get All Users" to load users.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- UPDATE USER -->
        <section class="card">
            <h2>Update User</h2>

            <form id="updateForm">
                <div class="form-group">
                    <label for="updateId">User ID</label>
                    <input
                        type="text"
                        id="updateId"
                        placeholder="Enter user ID"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">New Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter new username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">New Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter new email"
                        required
                    >
                </div>

                <button type="submit" class="update-btn">
                    Update User
                </button>
            </form>
        </section>

        <!-- DELETE USER -->
        <section class="card">
            <h2>Delete User</h2>

            <form id="deleteForm">
                <div class="form-group">
                    <label for="deleteId">User ID</label>
                    <input
                        type="text"
                        id="deleteId"
                        placeholder="Enter ID of the user to delete"
                        required
                    >
                </div>

                <button type="submit" class="delete-btn">
                    Delete User
                </button>
            </form>
        </section>

    </div>

    <script>
        const API_URL = "http://localhost:4000/users";

        const usersTable = document.getElementById("usersTable");
        const message = document.getElementById("message");

        // Display status messages
        function showMessage(text, type = "success") {
            message.textContent = text;
            message.className = type;
        }

        // Safely read API responses, including error responses
        async function readResponse(response) {
            const text = await response.text();

            let data;

            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                throw new Error(
                    text || `Server returned HTTP ${response.status}`
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.message || `Request failed: ${response.status}`
                );
            }

            return data;
        }

        // GET: Fetch all users
        async function getUsers() {
            try {
                const response = await fetch(API_URL);
                const data = await readResponse(response);

                // Supports either { users: [...] } or [...]
                const users = Array.isArray(data) ? data : data.users;

                if (!Array.isArray(users)) {
                    throw new Error(
                        "Expected an array of users from the API."
                    );
                }

                usersTable.replaceChildren();

                if (users.length === 0) {
                    usersTable.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty">
                                No users found.
                            </td>
                        </tr>
                    `;
                } else {
                    users.forEach((user) => {
                        const tr = document.createElement("tr");

                        // Avoid inserting user data as HTML
                        [user.id, user.username, user.email].forEach(value => {
                            const td = document.createElement("td");
                            td.textContent = value ?? "";
                            tr.appendChild(td);
                        });

                        const actions = document.createElement("td");

                        const editButton = document.createElement("button");
                        editButton.textContent = "Edit";
                        editButton.className = "update-btn";
                        editButton.onclick = () => {
                            document.getElementById("updateId").value = user.id;
                            document.getElementById("username").value = user.username;
                            document.getElementById("email").value = user.email;
                            document.getElementById("updateId").focus();
                        };

                        const deleteButton = document.createElement("button");
                        deleteButton.textContent = "Delete";
                        deleteButton.className = "delete-btn";
                        deleteButton.onclick = () => {
                            document.getElementById("deleteId").value = user.id;
                            document.getElementById("deleteId").focus();
                        };

                        actions.append(editButton, deleteButton);
                        tr.appendChild(actions);
                        usersTable.appendChild(tr);
                    });
                }

                showMessage(`Loaded ${users.length} user(s).`);
            } catch (error) {
                showMessage(
                    "Could not load users: " + error.message,
                    "error"
                );
            }
        }

        // PUT: Update username and email
        document.getElementById("updateForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const id = document.getElementById("updateId").value.trim();
                const username = document.getElementById("username").value.trim();
                const email = document.getElementById("email").value.trim();

                if (!id || !username || !email) {
                    showMessage("Please fill in all update fields.", "error");
                    return;
                }

                try {
                    const response = await fetch(
                        `${API_URL}/${encodeURIComponent(id)}`,
                        {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ username, email })
                        }
                    );

                    const data = await readResponse(response);

                    showMessage(data.message || "User updated successfully.");
                    this.reset();
                    await getUsers();
                } catch (error) {
                    showMessage(
                        "Could not update user: " + error.message,
                        "error"
                    );
                }
            }
        );

        // DELETE: Remove user by ID
        document.getElementById("deleteForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const id = document.getElementById("deleteId").value.trim();

                if (!id) {
                    showMessage("Please enter a user ID.", "error");
                    return;
                }

                if (!confirm("Are you sure you want to delete this user?")) {
                    return;
                }

                try {
                    const response = await fetch(
                        `${API_URL}/${encodeURIComponent(id)}`,
                        { method: "DELETE" }
                    );

                    const data = await readResponse(response);

                    showMessage(data.message || "User deleted successfully.");
                    this.reset();
                    await getUsers();
                } catch (error) {
                    showMessage(
                        "Could not delete user: " + error.message,
                        "error"
                    );
                }
            }
        );
    </script>
</body>
</html>
